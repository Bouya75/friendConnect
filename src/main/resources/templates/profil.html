<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Mon Profil - FriendConnect</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 40px; }
        .card { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .info { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label { font-weight: bold; color: #1877f2; }
    </style>
</head>
<link rel="stylesheet" href="/style.css">
<body>
<div class="card">
    <h2>Mon Profil</h2>
    <div class="info">
        <span class="label">Prénom :</span> <span th:text="${utilisateur.prenom}">Prénom</span>
    </div>
    <div class="info">
        <span class="label">Nom :</span> <span th:text="${utilisateur.nom}">Nom</span>
    </div>
    <div class="info">
        <span class="label">Email :</span> <span th:text="${utilisateur.email}">Email</span>
    </div>
    <h3>Modifier ma photo de profil</h3>
    <form action="/modifier-photo" method="post">
        <input type="text" name="urlPhoto" placeholder="Lien de votre image (URL)" required>
        <button type="submit">Mettre à jour</button>
    </form>
    <br>
    <a href="/membres">Voir tous les membres</a> |
    <a href="/deconnexion" style="color: red;">Se déconnecter</a>
    <hr>
    <h3>Mes Amis</h3>
    <div th:if="${not #lists.isEmpty(mesAmities)}">
        <a th:href="@{'/messages/' + ${lAmi.id}}" style="text-decoration: none; margin-left: 10px;">💬 Discuter</a>
        <div th:each="a : ${mesAmities}" style="display: flex; align-items: center; margin-bottom: 10px;">
            <div th:with="lAmi=${a.demandeur.id == utilisateur.id ? a.ami : a.demandeur}">
                <img th:src="${lAmi.photoUrl != null && lAmi.photoUrl != '' ? lAmi.photoUrl : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}"
                     style="width: 40px; height: 40px; border-radius: 50%; margin-right: 10px; object-fit: cover;">
                <span th:text="${lAmi.prenom + ' ' + lAmi.nom}" style="font-weight: bold;">Nom de l'ami</span>
            </div>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(mesAmities)}" style="color: #888;">Vous n'avez pas encore d'amis.</p>
</div>
<div th:each="ami : ${amis}">
    <span th:text="${ami.prenom}">Prénom</span>
    <a th:href="@{'/messages/' + ${ami.id}}" style="padding: 5px 10px; background: #0084ff; color: white; border-radius: 5px; text-decoration: none;">
        💬 Discuter
    </a>
</div>
</body>
<body>
<nav class="navbar">
    <a href="/membres">Membres</a>
    <a href="/profil">
        Mon Profil
        <span th:if="${nbMessages > 0}" style="...">[[${nbMessages}]]</span>
    </a>
    <a href="/deconnexion">Déconnexion</a>
</nav>

<div class="container">
</div>
</body>
</html>
